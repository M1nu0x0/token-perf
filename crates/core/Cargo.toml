[package]
name = "token-perf-core"
description = "Library that parses local coding-agent logs and attributes residual token cost to each tool, with SQLite storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"], optional = true }
rust-embed = { version = "8", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[features]
default = ["serve"]
serve = ["dep:axum", "dep:tokio", "dep:rust-embed"]
