[package]
name = "token-perf"
description = "Command-line tool that reads local coding-agent logs and attributes token waste to each tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "token-perf"
path = "src/main.rs"

[dependencies]
token-perf-core.workspace = true
axoupdater = { version = "0.10", features = ["blocking"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
rust-i18n = "4.2.1"
comfy-table = "8"
serde = "1"
serde_json = "1"

[features]
default = ["serve"]
serve = ["token-perf-core/serve", "dep:tokio"]
