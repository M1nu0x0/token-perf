subagent: "subagent"
depth: " · depth %{depth}"
totals: "%{calls} calls · %{output} output · %{cache_read} cache re-read · %{cache_write} cache write"
baseline: "Baseline context %{baseline} (system prompt, tool definitions, rule files) → billed %{billed} across the session"
cache_writes: "Cache writes — 5 min %{write_5m} · 1 hour %{write_1h} (the 1-hour cache costs twice the input rate)"
failed_calls: "%{count} failed or interrupted calls%{kinds}"
subagents: "Subagents (%{count}) — one tool call of this session each, so their tokens are part of its bill"
subagents_total: "With subagents — %{calls} calls · %{output} output · %{cache_read} cache re-read · %{cache_write} cache write"
