tool_residual: "Residual cost per tool (tokens left in context and billed again)"
worst_calls: "Calls that grew the context most"
serving: "token-perf: %{url}  (%{count} sessions)"
stop_hint: "Ctrl-C to stop"
serve_failed: "Could not start the server: %{error}"
unknown_lang: "Unknown language '%{code}'; ignoring --lang. Supported: en, ko."
bad_date: "Not a date: '%{value}'. Expected YYYY-MM-DD."
summary_empty: "No sessions in that date range."
summary_lead: "Looked over %{sessions} sessions and %{calls} calls."
summary_cache_read: "%{pct}% of your tokens went to re-reading what had already been read. You only said %{output} of new things, but re-read %{cache_read}."
summary_length: "The longer the conversation, the more often you buy the same tokens"
summary_tools: "What made it big (share of everything tools pushed into the conversation)"
summary_top_sessions: "The most expensive conversations"
summary_solo: "%{pct}% of the messages that used a tool called exactly one. Calling several at once cuts the round trips, and fewer round trips means less re-reading."

help:
  about: "Find where your tokens leak, from local agent logs"
  lang: "Interface language (en, ko). Saved for later runs"
  rescan: "Re-read every transcript from the start instead of only what is new"
  sessions: "List sessions, most re-billed cache first"
  sessions_top: "How many sessions to show"
  sessions_all: "Include subagent sessions (top-level only by default)"
  report: "Attribute one session's waste to the tools that caused it (defaults to the latest)"
  report_session: "Session id, or a unique prefix of one"
  report_top: "How many tools and calls to show"
  summary: "Aggregate every session, most re-billed first"
  since: "Earliest session date to include (YYYY-MM-DD)"
  until: "Latest session date to include (YYYY-MM-DD)"
  serve: "Start the web UI and open it in a browser"
  port: "Port to bind. Omit and the OS picks a free one"
  no_open: "Do not open a browser"
  config: "Show persisted settings, or change one"
  pretty: "Draw tables with Unicode borders instead of plain aligned columns (on/off)"
