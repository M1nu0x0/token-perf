name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The UI must be built first: build.rs fails the release build without it.
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # A tag can sit on a commit CI never saw.
      - run: cargo test --all-targets

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Archive
        run: |
          # No version in the name: /releases/latest/download/<name> needs an exact
          # filename, and the release the asset hangs off already carries the tag.
          NAME=token-perf-${{ matrix.target }}.tar.gz
          tar -czf "$NAME" -C target/${{ matrix.target }}/release token-perf
          sha256sum "$NAME" > "$NAME.sha256" 2>/dev/null || shasum -a 256 "$NAME" > "$NAME.sha256"
          echo "asset=$NAME" >> "$GITHUB_ENV"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The matrix jobs race for this; the losers find it already there.
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "" || true
          gh release upload "${{ github.ref_name }}" "$asset" "$asset.sha256" --clobber
