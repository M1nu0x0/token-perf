[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/M1nu0x0/token-perf"
readme = "README.md"

[workspace.dependencies]
token-perf-core = { path = "crates/core", version = "0.2.0", default-features = false }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
